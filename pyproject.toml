[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts"
version = "0.0.4"
description = "Qwen-TTS python package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "gradio>=4.0.0",
  "librosa>=0.10.0",
  "torchaudio==2.10.0+cu130",
  "soundfile>=0.12.0",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "openai-whisper>=20231117",
  "pydub>=0.25.0",
  "python-dotenv>=1.0.0",
  "numpy<2.0.0",
  "torch==2.10.0+cu130",
  "torchvision==0.25.0+cu130",
  "sox>=1.4.0",
  "onnxruntime>=1.16.0",
  "einops>=0.6.0",
  "hf-transfer",
]

[project.urls]
Homepage = "https://github.com/Qwen/Qwen3-TTS"
Repository = "https://github.com/Qwen/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]

[tool.uv]
# Configuration pour installer PyTorch avec CUDA 13.0
index-url = "https://download.pytorch.org/whl/cu130"
# Index PyPI par défaut pour les autres packages
extra-index-url = ["https://pypi.org/simple"]
# Autoriser UV à chercher dans tous les index
index-strategy = "unsafe-best-match"
